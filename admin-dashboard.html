<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Admin Dashboard</title>
    <script>
        // Security check: Redirect to login if not authenticated
        if (sessionStorage.getItem("adminLoggedIn") !== "true") {
            window.location.href = "admin-login.html";
        }
    </script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; margin: 0; padding: 20px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .btn-logout { background: #ff5555; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .panel { background: #1e1e1e; padding: 20px; margin-top: 20px; border-radius: 8px; }
        input, select { padding: 10px; margin: 5px 0; width: 100%; max-width: 400px; display: block; background: #252525; color: white; border: 1px solid #333; }
        .btn-submit { background: #1db954; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="navbar">
    <h1>Music Management Dashboard</h1>
    <button class="btn-logout" onclick="logout()">Logout</button>
</div>

<div class="panel">
    <h3>Add New Track</h3>
    <label>Song Title</label>
    <input type="text" placeholder="e.g., Midnight Shadows">
    
    <label>Artist</label>
    <input type="text" placeholder="e.g., The Midnight Trio">

    <label>Genre</label>
    <select>
        <option>Pop</option>
        <option>Rock</option>
        <option>Hip Hop</option>
        <option>Electronic</option>
    </select>

    <button class="btn-submit" onclick="alert('Track saved! (Simulated)')">Upload Track</button>
</div>

<script>
    function logout() {
        // Clear session and redirect
        sessionStorage.removeItem("adminLoggedIn");
        window.location.href = "admin-login.html";
    }
</script>

</body>
</html>
